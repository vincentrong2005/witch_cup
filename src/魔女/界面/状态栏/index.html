<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="展示魔女莉莉丝当前地点、时间、身体状态、同步道具与主角物品栏的沉浸式状态栏。" />
    <title>魔女莉莉丝状态栏</title>
  </head>
  <body>
    <main id="witch-status-app" class="status-shell" aria-labelledby="witch-status-title">
      <h1 id="witch-status-title" class="sr-only">魔女莉莉丝状态栏</h1>

      <div class="compact-status-grid">
        <aside
          id="witch-portrait-panel"
          class="portrait-panel"
          aria-labelledby="witch-portrait-heading"
          aria-expanded="false"
        >
          <h2 id="witch-portrait-heading" class="sr-only">莉莉丝立绘舞台</h2>
          <figure id="witch-portrait-stage" class="portrait-stage" aria-label="莉莉丝立绘展示区域" tabindex="0">
            <div class="portrait-frame">
              <img id="portrait-image" class="portrait-figure" alt="魔女立绘" />
              <div id="attribute-popover" class="attribute-popover" aria-label="基础属性">
                <div class="section-heading compact">
                  <div>
                    <p class="eyebrow">四维变量</p>
                    <h2 id="witch-state-heading">莉莉丝状态</h2>
                  </div>
                  <span id="sync-summary" class="sync-badge">同步待确认</span>
                </div>
                <div id="attribute-grid" class="attribute-grid"></div>
              </div>
            </div>
          </figure>
        </aside>

        <div class="status-right-column">
          <header id="world-status-bar" class="world-bar" aria-label="时间与地点">
            <div class="world-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img">
                <path d="M12 2.5 14.6 8l6 .8-4.3 4.1 1 5.9L12 16l-5.3 2.8 1-5.9L3.4 8.8l6-.8L12 2.5Z" />
              </svg>
            </div>
            <div class="world-copy">
              <p class="eyebrow">空间坐标</p>
              <p id="status-location" class="world-value">读取中</p>
            </div>
            <div class="world-divider" aria-hidden="true"></div>
            <div class="world-copy">
              <p class="eyebrow">叙事时间</p>
              <p id="status-time" class="world-value">读取中</p>
            </div>
          </header>

          <section id="status-workspace" class="status-workspace" aria-label="状态明细">
            <section class="glass-panel sync-board" aria-labelledby="sync-board-heading">
              <div class="section-heading compact">
                <div>
                  <h2 id="sync-board-heading">道具槽</h2>
                </div>
                <span id="sync-count" class="sync-badge">0 件</span>
              </div>
              <div id="sync-tool-list" class="sync-tool-gallery" aria-label="同步道具"></div>
            </section>

            <section class="quick-info-panel" aria-label="身体记录与物品栏">
              <div class="quick-info-actions">
                <button type="button" class="info-switch active" data-info-panel="body">
                  <span>身体记录</span>
                  <b id="body-count">0 项</b>
                </button>
                <button type="button" class="info-switch" data-info-panel="inventory">
                  <span id="inventory-heading">物品栏</span>
                  <b id="inventory-count">0 件</b>
                </button>
              </div>
            </section>

            <section id="sync-detail-view" class="glass-panel sync-detail-view" hidden aria-live="polite">
              <button type="button" id="sync-detail-close" class="detail-close" aria-label="关闭同步道具详情">×</button>
              <div id="sync-detail-image" class="sync-detail-image" aria-hidden="true"></div>
              <div class="sync-detail-copy">
                <p class="eyebrow">同步道具详情</p>
                <h2 id="sync-detail-name">道具详情</h2>
                <p id="sync-detail-status" class="detail-line"></p>
                <p id="sync-detail-count" class="detail-line"></p>
              </div>
            </section>

            <section id="info-detail-view" class="glass-panel info-detail-view" hidden aria-live="polite">
              <button type="button" id="info-detail-close" class="detail-close" aria-label="关闭信息详情">×</button>
              <div class="section-heading compact">
                <div>
                  <h2 id="info-detail-title">身体记录</h2>
                </div>
              </div>
              <div id="body-record-grid" class="body-record-grid" aria-label="身体记录"></div>
              <div id="inventory-grid" class="inventory-grid" aria-label="主角物品栏"></div>
            </section>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
